<!DOCTYPE html>
<html>
<head>
<title>Dashboard Interno</title>
<style>
  /* Destaque visual para o usuário e a postagem atualmente selecionados */
  li.selecionado {
    background-color: #d6e8ff;
    font-weight: bold;
  }

  /* Mensagens de status (carregando / erro) */
  li.mensagem-status {
    font-style: italic;
    color: #555;
    cursor: default;
  }

  li.mensagem-erro {
    color: #b00020;
    font-style: normal;
  }

  li[data-clicavel="true"] {
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>Dashboard de Comunicação</h1>

<h2>Usuários</h2>
<ul id="users"></ul>

<h2>Postagens</h2>
<ul id="posts"></ul>

<h2>Comentários</h2>
<ul id="comments"></ul>

<script src="script.js"></script>

</body>
</html>
